<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Architecture diagram">
<rect width="1200" height="440" rx="16" fill="#0b1020"/>
<text x="30" y="44" fill="#e6edf7" font-size="24" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Architecture (design)</text>
<rect x="30" y="90" width="230" height="130" rx="12" fill="#111a33" stroke="#22d3ee" stroke-width="2"/><text x="145.0" y="124" text-anchor="middle" fill="#22d3ee" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Causal window</text><text x="145.0" y="148" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">turns 0..target only</text><text x="145.0" y="166" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">no future turns</text><text x="145.0" y="184" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">shared in train/eval/runtime</text><text x="145.0" y="202" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">reject, never truncate target</text>
<line x1="262" y1="155" x2="318" y2="155" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></line><polygon points="318,155 309,149 309,161" fill="#22d3ee"/>
<rect x="320" y="90" width="250" height="130" rx="12" fill="#111a33" stroke="#3b82f6" stroke-width="2"/><text x="445.0" y="124" text-anchor="middle" fill="#3b82f6" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Qwen2.5-1.5B + LoRA</text><text x="445.0" y="148" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Apache-2.0 base (upstream)</text><text x="445.0" y="166" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">adapter: planned, untrained</text><text x="445.0" y="184" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">dialogue treated as data</text>
<line x1="572" y1="155" x2="628" y2="155" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></line><polygon points="628,155 619,149 619,161" fill="#3b82f6"/>
<rect x="630" y="90" width="250" height="130" rx="12" fill="#111a33" stroke="#22c55e" stroke-width="2"/><text x="755.0" y="124" text-anchor="middle" fill="#22c55e" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">JSON appraisal</text><text x="755.0" y="148" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">{{id, strength, evidence_turns}}</text><text x="755.0" y="166" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">subset of 150 dimensions</text><text x="755.0" y="184" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">omitted = unreported, not absent</text>
<line x1="882" y1="155" x2="938" y2="155" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></line><polygon points="938,155 929,149 929,161" fill="#22c55e"/>
<rect x="940" y="90" width="230" height="130" rx="12" fill="#111a33" stroke="#f59e0b" stroke-width="2"/><text x="1055.0" y="124" text-anchor="middle" fill="#f59e0b" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">State record</text><text x="1055.0" y="148" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">taxonomy version + speaker</text><text x="1055.0" y="166" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">known dims + strengths</text><text x="1055.0" y="184" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">NcR subset rank + SHA-256</text>
<rect x="30" y="270" width="1140" height="130" rx="12" fill="none" stroke="#7b8aa5" stroke-dasharray="6 6"/>
<text x="50" y="298" fill="#7b8aa5" font-size="14" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">KEPT SEPARATE BY DESIGN (not part of this adapter's output)</text>
<rect x="60" y="312" width="330" height="70" rx="12" fill="#111a33" stroke="#22d3ee" stroke-width="2"/><text x="225.0" y="346" text-anchor="middle" fill="#22d3ee" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Speaker appraisal</text><text x="225.0" y="370" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">what the speaker expressed</text>
<rect x="435" y="312" width="330" height="70" rx="12" fill="#111a33" stroke="#3b82f6" stroke-width="2"/><text x="600.0" y="346" text-anchor="middle" fill="#3b82f6" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Companion response state</text><text x="600.0" y="370" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">how the companion should respond</text>
<rect x="810" y="312" width="330" height="70" rx="12" fill="#111a33" stroke="#f59e0b" stroke-width="2"/><text x="975.0" y="346" text-anchor="middle" fill="#f59e0b" font-size="17" font-weight="700" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Safety decisions</text><text x="975.0" y="370" text-anchor="middle" fill="#c7d2e4" font-size="13" font-family="'Segoe UI',Helvetica,Arial,sans-serif">handled outside the appraisal model</text>
</svg>
